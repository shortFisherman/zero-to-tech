name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建
        run: npm run build

      - name: 部署到 VPS
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          # 准备部署密钥
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # 打包并上传
          tar czf dist.tar.gz dist
          scp -P 10188 -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no dist.tar.gz root@150.138.73.135:/tmp/

          # 解压 + 重载 nginx
          ssh -p 10188 -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@150.138.73.135 "tar xzf /tmp/dist.tar.gz -C /var/www/zero-to-tech --strip-components=1 && rm /tmp/dist.tar.gz && systemctl reload nginx"
